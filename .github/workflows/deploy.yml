name: Publish Chromalie
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Queue publication runs instead of interrupting an active build or deploy.
# GitHub retains at most one pending run per concurrency group.
concurrency:
  group: chromalie-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Import and verify the approved colouring artwork
        run: python3 scripts/import-assets.py
      - name: Verify imported artwork without creating a commit
        run: |
          # The approved artwork may be restored from its checksum manifest.
          # Keep these files in the deployment artifact; do not push from CI.
          echo "Artwork imported and verified against assets-manifest.json."
      - name: Check colouring engine
        run: node --test tests/engine.test.js
      - name: Check browser modules
        run: |
          node --check dist/app.js
          node --check dist/engine.js
          node --check dist/regions-worker.js
          node --check dist/brand.js
          node --check dist/guide.js
          node --check dist/tabs.js
          node --check dist/mobile.js
          node --check dist/journal.js
          node --check dist/count.js
          node --check dist/share.js
          node --check dist/keep.js
      - name: Stamp asset addresses so phones load the new files
        run: python3 scripts/stamp-assets.py dist
      - name: Install the browser test's tools
        run: |
          npm i --no-save playwright-core@1.56.1 axe-core@4.10.3
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Browser test and accessibility audit
        run: node tests/ui.test.mjs
      - name: Write public release identity
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('dist/version.json').write_text(json.dumps({
            'commit': os.environ['GITHUB_SHA'],
            'run_id': os.environ['GITHUB_RUN_ID'],
            'repository': os.environ['GITHUB_REPOSITORY']
          }) + chr(10))
          PY
      - name: Preserve responsive screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromalie-responsive-screenshots
          path: test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test the published homepage and painting engine
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, html.parser
          base='https://chromalie.page/'
          def get(path):
              request=urllib.request.Request(urllib.parse.urljoin(base,path),headers={'Cache-Control':'no-cache','User-Agent':'Chromalie-Live-Smoke-Test'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f'HTTP {response.status}: {path}')
                  return response.read()
          homepage=get('/')
          if b'Chromalie' not in homepage and b'chromalie' not in homepage:
              raise SystemExit('Live homepage does not contain Chromalie branding')
          for path in ('app.js','engine.js','mobile.js','journal.js','style.css'):
              body=get(path)
              if len(body)<100:
                  raise SystemExit(f'Live asset missing or suspiciously short: {path}')
              print(f'Live asset OK: {path} ({len(body)} bytes)')
          print('Live homepage and core studio assets verified')
          PY
      - name: Verify the public website serves this commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          LIVE_VERSION_URL: https://chromalie.page/version.json
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url=os.environ['LIVE_VERSION_URL']
          expected=os.environ['EXPECTED_COMMIT']
          for attempt in range(18):
              try:
                  request=urllib.request.Request(url + '?check=' + expected[:12], headers={'Cache-Control':'no-cache','User-Agent':'Chromalie-Deploy-Verification'})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      payload=json.load(response)
                  actual=payload.get('commit')
                  if actual == expected:
                      print('Verified live deployment:', actual, url)
                      break
                  print('Published version not updated yet:', actual, 'expected:', expected)
              except Exception as exc:
                  print('Live version check:', str(exc))
              if attempt == 17:
                  raise SystemExit('Deployment did not become verifiably live within the verification window')
              time.sleep(10)
          PY
