name: Validate painting studio
# Manual only since 21 October 2026. On every pull request it ran the same engine
# tests, syntax checks and browser audit as "Publish Chromalie" (which also imports
# the artwork first), so each change paid for the browser test twice on the PR and
# once more on merge. Run it by hand if you want it on its own.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          for file in dist/*.js; do node --check "$file"; done
      - name: Test colouring engine
        run: node --test tests/engine.test.js tests/catalog.test.js
      - name: Install browser test tools
        run: |
          npm i --no-save playwright-core@1.56.1 axe-core@4.10.3
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Run browser and accessibility tests
        run: node tests/ui.test.mjs
